<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آزمون تربیت بدنی | دانشگاه فرهنگیان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#123329; --ink-soft:#3c5a50; --line:#d7e3dc;
  --bg:#f2f7f3; --surface:#ffffff; --surface-2:#eef4ee;
  --brand:#1f6b52; --brand-dark:#134a39; --brand-light:#e4f0e8;
  --gold:#c99a3a; --teal:#1c7a8c; --danger:#b3492f;
  --radius:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eaf1ec; --ink-soft:#b9c9c0; --line:#25493c;
    --bg:#0c1e17; --surface:#122c22; --surface-2:#173627;
    --brand:#3fa47f; --brand-dark:#2c8064; --brand-light:#173a2c;
  }
}
:root[data-theme="dark"]{
  --ink:#eaf1ec; --ink-soft:#b9c9c0; --line:#25493c;
  --bg:#0c1e17; --surface:#122c22; --surface-2:#173627;
  --brand:#3fa47f; --brand-dark:#2c8064; --brand-light:#173a2c;
}
*{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:'Vazirmatn',sans-serif;line-height:1.7;
  background-image:
    radial-gradient(560px 320px at 100% -10%, color-mix(in srgb, var(--gold) 16%, transparent), transparent 60%),
    radial-gradient(600px 360px at -10% 0%, color-mix(in srgb, var(--brand) 18%, transparent), transparent 60%),
    repeating-linear-gradient(115deg, color-mix(in srgb, var(--brand) 6%, transparent) 0 2px, transparent 2px 46px);
  background-attachment:fixed;
}
img{max-width:100%}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand .dot{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--teal));flex:none;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px -6px color-mix(in srgb, var(--brand) 70%, transparent)}
.brand .dot svg{width:24px;height:24px}
.brand h1{font-size:16.5px;margin:0;font-weight:800;color:var(--ink)}
.brand span{display:block;font-size:12.5px;color:var(--ink-soft);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:var(--radius);padding:24px;margin-bottom:16px;box-shadow:0 10px 24px -18px rgba(18,51,41,.35)}
.title{font-size:22px;font-weight:800;margin:0 0 6px}
.sub{color:var(--ink-soft);font-size:14.5px;margin:0 0 20px}
label{display:block;font-size:13.5px;font-weight:600;color:var(--ink-soft);margin:14px 0 6px}
input[type=text],input[type=email],input[type=number],textarea{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:15px;outline:none;transition:border-color .15s
}
input:focus,textarea:focus{border-color:var(--brand)}
textarea{resize:vertical;min-height:90px}
.btn{appearance:none;border:none;border-radius:11px;padding:13px 22px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:transform .1s, opacity .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;width:100%}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#a97c22);color:#3a2a06}
.err{color:var(--danger);font-size:13px;margin-top:10px;display:none}
.top-timer{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(135deg,var(--brand-dark),var(--teal));color:#fff;padding:10px 16px;border-radius:0 0 14px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;margin-bottom:18px;box-shadow:0 8px 18px -10px rgba(0,0,0,.35)}
.qcard{margin-bottom:14px}
.qhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qnum{flex:none;width:28px;height:28px;border-radius:8px;background:var(--brand-light);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.qtext{font-weight:600;font-size:15.5px}
.opt{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:14.5px}
.opt:hover{border-color:var(--brand)}
.opt input{accent-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:var(--brand-light)}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:var(--gold);transition:width .3s}
.footlink{text-align:center;margin-top:26px;font-size:12px;color:var(--ink-soft);opacity:.6}
.footlink a{color:inherit}
.donewrap{text-align:center;padding:50px 20px}
.donewrap .big{font-size:44px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--ink-soft);font-weight:700;font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--brand)}
.stat span{font-size:12px;color:var(--ink-soft)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.hidden{display:none !important}
.scrollx{overflow-x:auto}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.chartbox h4{margin:0 0 10px;font-size:13.5px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--surface);border-radius:16px 16px 0 0;max-width:760px;width:100%;max-height:85vh;overflow:auto;padding:20px}
.chip{display:inline-block;background:var(--brand-light);color:var(--brand-dark);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;margin-inline-end:6px}
.keymap{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}
.keymap div{border-radius:12px;padding:16px 10px;text-align:center;color:#fff;font-weight:800}
.keymap div small{display:block;font-size:12px;font-weight:600;opacity:.9;margin-top:4px}
.keymap div b{font-size:22px}
#reactBox{height:190px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:16px;transition:background .1s}
.reactBtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.reactBtns button{border:none;border-radius:10px;padding:14px 4px;color:#fff;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer}
@media print{
  body *{visibility:hidden}
  #printSheet,#printSheet *{visibility:visible}
  #printSheet{position:absolute;inset:0;padding:20px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="printSheet" class="hidden"></div>

<script>
/* ---------- داده سوالات (نمونه — قابل جایگزینی) ---------- */
const QUESTIONS = [
 {id:1,type:'mcq',q:'کدام یک از موارد زیر جزو اصول پایه گرم کردن بدن پیش از فعالیت ورزشی است؟',opts:['افزایش تدریجی ضربان قلب','شروع با حرکات کششی شدید','نوشیدن آب سرد فراوان','استراحت کامل عضلات']},
 {id:2,type:'mcq',q:'ورزش هوازی (Aerobic) عمدتاً کدام سیستم بدن را تقویت می‌کند؟',opts:['سیستم قلبی-تنفسی','سیستم گوارش','سیستم عصبی مرکزی','سیستم ایمنی فقط']},
 {id:3,type:'mcq',q:'در والیبال، کدام مهارت برای شروع امتیاز از پشت خط انتهایی زمین استفاده می‌شود؟',opts:['سرویس','بلاک','اسپک','پاس']},
 {id:4,type:'mcq',q:'کدام گزینه یکی از فواید فعالیت بدنی منظم برای دانشجویان است؟',opts:['کاهش استرس و بهبود تمرکز','افزایش خستگی مزمن','کاهش ظرفیت ریوی','کاهش تراکم استخوان']},
 {id:5,type:'mcq',q:'در فوتبال، خطای «آفساید» زمانی رخ می‌دهد که بازیکن مهاجم:',opts:['نزدیک‌تر از توپ و مدافع آخر به خط دروازه حریف باشد','توپ را با دست لمس کند','خارج از زمین برود','به دروازه‌بان تنه بزند']},
 {id:6,type:'mcq',q:'کدام یک از این حرکات جزو تمرینات انعطاف‌پذیری (Flexibility) محسوب می‌شود؟',opts:['کشش استاتیک عضلات همسترینگ','دویدن سرعتی','وزنه‌برداری سنگین','شنای غیراستقامتی']},
 {id:7,type:'mcq',q:'ضربان قلب هدف در تمرینات هوازی متوسط معمولاً چند درصد ضربان قلب بیشینه است؟',opts:['۶۰ تا ۷۰ درصد','۱۰ تا ۲۰ درصد','۹۵ تا ۱۰۰ درصد','۳۰ تا ۴۰ درصد']},
 {id:8,type:'mcq',q:'در بسکتبال، اصطلاح «دبل دریبل» به چه معناست؟',opts:['دریبل مجدد پس از نگه‌داشتن توپ با دو دست','پاس دو دستی','پرتاب آزاد دوم','دفاع دو نفره']},
 {id:9,type:'mcq',q:'کدام گروه غذایی نقش اصلی را در بازسازی عضلات پس از تمرین ورزشی دارد؟',opts:['پروتئین‌ها','قندهای ساده فراوان','چربی‌های اشباع','نوشابه‌های گازدار']},
 {id:10,type:'mcq',q:'در تربیت‌بدنی مدارس، هدف اصلی «آمادگی جسمانی» (Physical Fitness) چیست؟',opts:['توانایی انجام فعالیت‌های روزمره بدون خستگی بیش از حد','فقط افزایش قدرت عضلانی','فقط کاهش وزن','فقط سرعت دویدن']},
 {id:11,type:'mcq',q:'کدام یک اصل صحیح ایمنی هنگام اجرای تمرینات ورزشی گروهی است؟',opts:['رعایت فاصله ایمن و استفاده از تجهیزات مناسب','انجام حرکات بدون گرم کردن','نادیده گرفتن درد ناگهانی','استفاده از کفش نامناسب']},
 {id:12,type:'mcq',q:'کدام مهارت حرکتی جزو مهارت‌های بنیادی (Fundamental Movement Skills) کودکان است؟',opts:['دویدن، پریدن و پرتاب کردن','مدیریت زمان','حل مسئله ریاضی','خواندن متن']},
 {id:13,type:'mcq',q:'اصطلاح «استقامت عضلانی» به چه معناست؟',opts:['توانایی عضله برای انقباض مکرر در برابر مقاومت','حداکثر نیروی یک انقباض','سرعت انقباض عضله','دامنه حرکتی مفصل']},
 {id:14,type:'mcq',q:'کدام مورد زیر یک اصل صحیح برنامه‌ریزی تمرینی است؟',opts:['اصل تدریجی بودن (Progressive Overload)','افزایش ناگهانی شدت بدون آمادگی','حذف کامل زمان استراحت','تکرار یک تمرین ثابت برای همیشه']},
 {id:15,type:'mcq',q:'در شنا، کدام یک از سبک‌های چهارگانه رسمی مسابقات است؟',opts:['کرال سینه (فرانتکرال)','شنای سگی','شنای روی شکم آزاد','غواصی بدون تجهیزات']},
 {id:16,type:'essay',q:'به نظر شما فعالیت بدنی منظم چه تأثیری بر عملکرد تحصیلی دانشجویان دارد؟ به‌طور خلاصه توضیح دهید.'},
 {id:17,type:'essay',q:'یک برنامه گرم کردن ۱۰ دقیقه‌ای پیش از یک جلسه تمرین ورزشی پیشنهاد دهید.'},
 {id:18,type:'essay',q:'تفاوت اصلی بین تمرینات هوازی و بی‌هوازی را با یک مثال از هرکدام بنویسید.'},
 {id:19,type:'essay',q:'چه راهکارهایی برای افزایش انگیزه دانشجویان به شرکت در فعالیت‌های ورزشی دانشگاه پیشنهاد می‌کنید؟'},
 {id:20,type:'essay',q:'یک خاطره یا تجربه شخصی از ورزش که در شکل‌گیری روحیه شما تأثیرگذار بوده را بنویسید.'}
];
const EXAM_SECONDS = 30*60;
const ADMIN_USER='admin', ADMIN_PASS='admin';
const STORE_KEY='pe_exam_submissions_v1';

/* ---------- سوالات پرسشنامه (نمونه — قابل جایگزینی با ابزار استاندارد) ---------- */
const LIKERT=['کاملاً مخالفم','مخالفم','نظری ندارم','موافقم','کاملاً موافقم'];
const PSYCH_QUESTIONS = [
 {id:'f1',dim:'انعطاف‌پذیری شناختی',q:'وقتی شرایط غیرمنتظره پیش می‌آید، به‌راحتی برنامه‌ام را تغییر می‌دهم.'},
 {id:'f2',dim:'انعطاف‌پذیری شناختی',q:'می‌توانم به یک مسئله از چند زاویه متفاوت نگاه کنم.'},
 {id:'f3',dim:'انعطاف‌پذیری شناختی',q:'در مواجهه با یک مانع، راه‌حل‌های جایگزین به ذهنم می‌رسد.'},
 {id:'f4',dim:'انعطاف‌پذیری شناختی',q:'تغییر ناگهانی در برنامه‌هایم مرا دچار سردرگمی زیادی نمی‌کند.'},
 {id:'f5',dim:'انعطاف‌پذیری شناختی',q:'می‌توانم بین چند فعالیت مختلف به‌راحتی جابه‌جا شوم.'},
 {id:'f6',dim:'انعطاف‌پذیری شناختی',q:'وقتی یک راه‌حل جواب نمی‌دهد، به‌سرعت راه‌حل دیگری امتحان می‌کنم.'},
 {id:'f7',dim:'انعطاف‌پذیری شناختی',q:'در موقعیت‌های جدید، به‌جای پافشاری بر عادت‌های قبلی، روش‌های تازه را امتحان می‌کنم.'},
 {id:'f8',dim:'انعطاف‌پذیری شناختی',q:'نظرم را در برابر اطلاعات و شواهد جدید به‌راحتی تغییر می‌دهم.'},
 {id:'m1',dim:'توجه و آگاهی ذهن‌آگاهانه',q:'هنگام انجام یک کار، تمرکزم را روی همان کار حفظ می‌کنم.'},
 {id:'m2',dim:'توجه و آگاهی ذهن‌آگاهانه',q:'نسبت به احساسات بدنی خودم (مثل تنش عضلانی) آگاهی دارم.'},
 {id:'m3',dim:'توجه و آگاهی ذهن‌آگاهانه',q:'زمانی که کسی صحبت می‌کند، کاملاً به حرف‌هایش گوش می‌دهم بدون آنکه ذهنم جای دیگری باشد.'},
 {id:'m4',dim:'توجه و آگاهی ذهن‌آگاهانه',q:'متوجه تغییرات کوچک در محیط اطرافم می‌شوم.'},
 {id:'m5',dim:'توجه و آگاهی ذهن‌آگاهانه',q:'کارهای روزمره را با دقت و آگاهی کامل انجام می‌دهم، نه به‌صورت خودکار و بی‌توجه.'},
 {id:'m6',dim:'توجه و آگاهی ذهن‌آگاهانه',q:'وقتی احساس ناخوشایندی دارم، آن را بدون قضاوت درباره خودم می‌پذیرم.'},
 {id:'m7',dim:'توجه و آگاهی ذهن‌آگاهانه',q:'در طول تمرین یا فعالیت ورزشی، کاملاً به حرکات بدنم توجه دارم.'},
 {id:'m8',dim:'توجه و آگاهی ذهن‌آگاهانه',q:'کمتر پیش می‌آید که کاری را بدون توجه کامل و به‌صورت خودکار انجام دهم.'}
];

/* ---------- بازی زمان واکنش ---------- */
const COLORS = [
  {key:'A', name:'زرد', hex:'#eab308'},
  {key:'X', name:'سبز', hex:'#16a34a'},
  {key:'W', name:'آبی', hex:'#2563eb'},
  {key:'D', name:'قرمز', hex:'#dc2626'}
];
const REACTION_TRIALS = 12;
const REACTION_DELAY = 500;
function buildReactionSequence(){ const seq=[]; for(let i=0;i<REACTION_TRIALS;i++) seq.push(COLORS[Math.floor(Math.random()*4)]); return seq; }

function loadSubs(){ try{return JSON.parse(localStorage.getItem(STORE_KEY)||'[]')}catch(e){return []} }
function saveSubs(list){ try{localStorage.setItem(STORE_KEY, JSON.stringify(list))}catch(e){} }
function addSub(sub){ const list=loadSubs(); list.push(sub); saveSubs(list); }

let state = { view:'info', student:null, answers:{}, psychAnswers:{}, timeLeft:EXAM_SECONDS, timerId:null, qIndex:0,
  reactionStage:'intro', reactionSeq:[], reactionIndex:0, reactionTrials:[], reactionPhase:'idle', reactionStart:0, reactionColor:null };

const app = document.getElementById('app');
function render(){ app.innerHTML=''; 
  if(state.view==='info') return renderInfo();
  if(state.view==='reaction') return renderReaction();
  if(state.view==='psych') return renderPsych();
  if(state.view==='quiz') return renderQuiz();
  if(state.view==='done') return renderDone();
  if(state.view==='adminLogin') return renderAdminLogin();
  if(state.view==='admin') return renderAdmin();
}
function brandHeader(sub, icon){
  const ICONS={
    run:'<path d="M13 4a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" fill="#fff"/><path d="M9 22l2.2-5.4L9 14l1-4.5 3 2 2 4.5 3.5 1.3M7 12l3-2.5 2 1.5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
    stopwatch:'<circle cx="12" cy="13" r="7.5" stroke="#fff" stroke-width="1.6" fill="none"/><path d="M12 13V9M9 2h6M12 2v2.2M18.5 6l1.3-1.3" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>',

function isValidNationalCode(code){
  if(!/^\d{10}$/.test(code)) return false;
  if(/^(\d)\1{9}$/.test(code)) return false;
  let sum=0; for(let i=0;i<9;i++) sum+=parseInt(code[i])*(10-i);
  const r=sum%11, check=parseInt(code[9]);
  return (r<2 && check===r) || (r>=2 && check===11-r);
}

let reactionKeyHandler=null;
function renderReaction(){
  app.appendChild(brandHeader('سنجش زمان واکنش','stopwatch'));
  if(state.reactionStage==='intro'){

     <div class="keymap">
       ${COLORS.map(c=>`<div style="background:${c.hex}"><b>${c.key}</b><small>رنگ ${c.name}</small></div>`).join('')}
     </div>
     <p class="sub" style="margin-bottom:6px">این آزمون شامل ${REACTION_TRIALS} مرحله است. هر بار برای شروعِ نمایش رنگ، کلید Enter را بزنید.</p>
     <button class="btn btn-primary" id="rc_start">متوجه شدم، شروع کن</button>`;
    app.appendChild(c);
    document.getElementById('rc_start').onclick=()=>{ state.reactionStage='playing'; state.reactionPhase='idle'; render(); };
    return;
  }
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<p class="title">مرحله ${state.reactionIndex+1} از ${REACTION_TRIALS}</p>
   <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
     ${COLORS.map(c=>`<span class="chip" style="background:${c.hex}22;color:${c.hex}">${c.key} = ${c.name}</span>`).join('')}
   </div>
   <div id="reactBox" style="background:var(--surface-2);border:2px dashed var(--line);color:var(--ink-soft)">برای نمایش رنگ، دکمه زیر را بزنید یا کلید Enter را فشار دهید</div>
   <button class="btn btn-primary" id="rc_ready" style="margin-top:12px">آماده‌ام</button>
   <p id="reactMsg" class="sub" style="margin-top:12px;text-align:center;min-height:20px"></p>
   <div class="reactBtns">
     ${COLORS.map(c=>`<button style="background:${c.hex}" data-k="${c.key}">${c.key}</button>`).join('')}
   </div>`;
  app.appendChild(c);
  document.getElementById('rc_ready').onclick=()=>handleReactionInput('ENTER');
  c.querySelectorAll('.reactBtns button').forEach(b=> b.onclick=()=>handleReactionInput(b.dataset.k));
  setupReactionTrial();
}
function setupReactionTrial(){
  if(reactionKeyHandler) document.removeEventListener('keydown', reactionKeyHandler);
  reactionKeyHandler=(e)=>handleReactionInput(e.key.toUpperCase());
  document.addEventListener('keydown', reactionKeyHandler);
}
function handleReactionInput(key){
  const box=document.getElementById('reactBox'); if(!box) return;
  if(state.reactionPhase==='idle'){
    if(key==='ENTER'){
      state.reactionPhase='waiting'; state.reactionStart=performance.now();
      box.textContent='...'; box.style.background='var(--surface-2)'; box.style.border='2px dashed var(--line)'; box.style.color='var(--ink-soft)';
      setTimeout(()=>{
        if(state.reactionPhase!=='waiting') return;
        state.reactionColor=state.reactionSeq[state.reactionIndex]; state.reactionPhase='shown';
        box.style.background=state.reactionColor.hex; box.style.border='none'; box.textContent='';
      }, REACTION_DELAY);
    }
  } else if(state.reactionPhase==='shown'){
    if(!['A','X','W','D'].includes(key)) return;
    const elapsed=performance.now()-state.reactionStart;
    const rt=Math.max(0, Math.round(elapsed-REACTION_DELAY));
    const correct = key===state.reactionColor.key;
    state.reactionTrials.push({trial:state.reactionIndex+1, color:state.reactionColor.name, correctKey:state.reactionColor.key, pressedKey:key, correct, rt});
    state.reactionIndex++; state.reactionPhase='idle';
    if(reactionKeyHandler) document.removeEventListener('keydown', reactionKeyHandler);
    const msg=document.getElementById('reactMsg');
    if(msg) msg.textContent=(correct?'درست ✅ — ':'نادرست ❌ — ')+rt+' میلی‌ثانیه';
    setTimeout(()=>{ state.reactionIndex>=REACTION_TRIALS ? finishReaction() : render(); }, 600);
  }
}
function finishReaction(){
  if(reactionKeyHandler) document.removeEventListener('keydown', reactionKeyHandler);
  state.view='psych'; state.psychAnswers={}; render();
}

function submitExam(){
  clearInterval(state.timerId);
  const rt=state.reactionTrials, correctRt=rt.filter(t=>t.correct);
  const avgRt=correctRt.length? Math.round(correctRt.reduce((a,t)=>a+t.rt,0)/correctRt.length) : null;
  const flexVals=PSYCH_QUESTIONS.filter(q=>q.dim.includes('انعطاف')).map(q=>state.psychAnswers[q.id]).filter(v=>v!=null);
  const mindVals=PSYCH_QUESTIONS.filter(q=>q.dim.includes('ذهن‌آگاه')).map(q=>state.psychAnswers[q.id]).filter(v=>v!=null);
  const avg=arr=>arr.length? +(arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(2) : null;
  const sub={ id:'s_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), ...state.student,
    answers: QUESTIONS.map(q=>({id:q.id,q:q.q,type:q.type,answer:state.answers[q.id]||''})),
    psychAnswers: PSYCH_QUESTIONS.map(q=>({id:q.id,dim:q.dim,q:q.q,value:state.psychAnswers[q.id]||null})),
    cognitiveFlexScore: avg(flexVals), mindfulAttnScore: avg(mindVals),
    reactionTrials: rt, reactionAvgMs: avgRt, reactionAccuracy: rt.length? Math.round(correctRt.length/rt.length*100) : null,
    submittedAt: new Date().toISOString() };
  addSub(sub);
  state.view='done'; render();
}

function exportExcel(subs){
  const rows=subs.map(s=>{
    const base={ 'نام':s.firstName,'نام خانوادگی':s.lastName,'کد ملی':s.nationalCode||'','نام پدر':s.fatherName,'سال ورود':s.entryYear,'سال تولد':s.birthYear,'ایمیل':s.email,
      'نمره انعطاف‌پذیری شناختی':s.cognitiveFlexScore??'', 'نمره توجه ذهن‌آگاهانه':s.mindfulAttnScore??'',
      'میانگین زمان واکنش (ms)':s.reactionAvgMs??'', 'دقت واکنش (%)':s.reactionAccuracy??'', 'زمان ثبت':new Date(s.submittedAt).toLocaleString('fa-IR') };
    s.answers.forEach(a=>{ base['س'+a.id]=a.answer; });
    (s.reactionTrials||[]).forEach(t=>{ base['واکنش-مرحله'+t.trial]=t.rt+(t.correct?'':'*'); });
    return base;
  });
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'نتایج');
  XLSX.writeFile(wb,'نتایج-آزمون-تربیت-بدنی.xlsx');
}

function viewSub(id){
  const subs=loadSubs(); const s=subs.find(x=>x.id===id); if(!s) return;
  const ps=document.getElementById('printSheet');
  let qa=s.answers.map(a=>'<div style="margin-bottom:12px"><b>'+a.q+'</b><div style="margin-top:4px;color:#333">'+(a.answer||'—')+'</div></div>').join('');
  ps.innerHTML=`<div style="font-family:Vazirmatn,sans-serif;direction:rtl">
    <h2>برگه آزمون تربیت بدنی — دانشگاه فرهنگیان</h2>
    <p><b>نام و نام‌خانوادگی:</b> ${s.firstName} ${s.lastName} &nbsp; | &nbsp; <b>کد ملی:</b> ${s.nationalCode||'—'} &nbsp; | &nbsp; <b>نام پدر:</b> ${s.fatherName}</p>
    <p><b>سال ورود:</b> ${s.entryYear} &nbsp; | &nbsp; <b>سال تولد:</b> ${s.birthYear} &nbsp; | &nbsp; <b>ایمیل:</b> ${s.email}</p>
    <p><b>زمان ثبت:</b> ${new Date(s.submittedAt).toLocaleString('fa-IR')}</p>
    <p><b>میانگین زمان واکنش:</b> ${s.reactionAvgMs??'—'} میلی‌ثانیه &nbsp; | &nbsp; <b>دقت واکنش:</b> ${s.reactionAccuracy!=null?s.reactionAccuracy+'٪':'—'}</p>
    <p><b>نمره انعطاف‌پذیری شناختی:</b> ${s.cognitiveFlexScore??'—'} از ۵ &nbsp; | &nbsp; <b>نمره توجه ذهن‌آگاهانه:</b> ${s.mindfulAttnScore??'—'} از ۵</p>
    <hr>${qa}</div>`;
  ps.classList.remove('hidden');
  window.print();
  setTimeout(()=>ps.classList.add('hidden'),500);
}

if(location.hash==='#admin'){ state.view='adminLogin'; }
render();
</script>
