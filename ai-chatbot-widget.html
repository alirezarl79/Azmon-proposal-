<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دستیار هوش مصنوعی</title>
<style>
  :root{
    --bg:#1c1d1f; --panel:#242527; --accent:#5b8cff; --text:#eceef1; --muted:#9a9ea6; --bubble-user:#2f6fed; --bubble-bot:#33353a;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Vazirmatn',Tahoma,sans-serif;background:transparent;}
  #chat-toggle{
    position:fixed;bottom:20px;left:20px;width:58px;height:58px;border-radius:50%;
    background:var(--accent);border:none;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;z-index:9999;
  }
  #chat-toggle svg{width:26px;height:26px;fill:#fff;}
  #chat-window{
    position:fixed;bottom:90px;left:20px;width:340px;max-width:92vw;height:480px;max-height:75vh;
    background:var(--panel);border-radius:16px;display:none;flex-direction:column;overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.45);z-index:9999;border:1px solid #3a3b3f;
  }
  #chat-window.open{display:flex;}
  #chat-header{
    padding:14px 16px;background:#1a1b1d;color:var(--text);font-size:15px;font-weight:600;
    display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #3a3b3f;
  }
  #chat-header span.status{width:8px;height:8px;border-radius:50%;background:#4caf6a;display:inline-block;margin-left:6px;}
  #chat-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;}
  #chat-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:82%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.6;white-space:pre-wrap;}
  .msg.user{align-self:flex-end;background:var(--bubble-user);color:#fff;border-bottom-left-radius:4px;}
  .msg.bot{align-self:flex-start;background:var(--bubble-bot);color:var(--text);border-bottom-right-radius:4px;}
  .msg.typing{color:var(--muted);font-style:italic;}
  #chat-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid #3a3b3f;}
  #chat-input{
    flex:1;background:#1a1b1d;border:1px solid #3a3b3f;border-radius:10px;color:var(--text);
    padding:10px 12px;font-size:14px;resize:none;font-family:inherit;
  }
  #chat-send{background:var(--accent);border:none;color:#fff;border-radius:10px;padding:0 16px;cursor:pointer;font-size:14px;}
  #chat-send:disabled{opacity:.5;cursor:default;}
  #chat-messages::-webkit-scrollbar{width:6px;}
  #chat-messages::-webkit-scrollbar-thumb{background:#3a3b3f;border-radius:3px;}
</style>
</head>
<body>

<button id="chat-toggle" aria-label="باز کردن چت">
  <svg viewBox="0 0 24 24"><path d="M4 4h16v12H7l-3 3V4z"/></svg>
</button>

<div id="chat-window">
  <div id="chat-header">
    <div><span class="status"></span>دستیار هوش مصنوعی</div>
    <button id="chat-close">✕</button>
  </div>
  <div id="chat-messages"></div>
  <div id="chat-input-row">
    <textarea id="chat-input" rows="1" placeholder="پیامت رو بنویس..."></textarea>
    <button id="chat-send">ارسال</button>
  </div>
</div>

<script>
/* =========================================================
   تنظیمات — این بخش را با اطلاعات خودت پر کن
   ========================================================= */
const API_KEY   = "PASTE_YOUR_FREE_GROQ_API_KEY_HERE"; // از console.groq.com رایگان بگیر
const API_URL   = "https://api.groq.com/openai/v1/chat/completions";
const MODEL     = "llama-3.3-70b-versatile"; // مدل رایگان و قوی گروک
const SYSTEM_PROMPT = "تو یک دستیار هوش مصنوعی مفید، مودب و مختصر هستی که به فارسی پاسخ می‌دهی.";
/* ========================================================= */

const toggle = document.getElementById('chat-toggle');
const win = document.getElementById('chat-window');
const closeBtn = document.getElementById('chat-close');
const messagesEl = document.getElementById('chat-messages');
const input = document.getElementById('chat-input');
const sendBtn = document.getElementById('chat-send');

let history = [{role:"system", content: SYSTEM_PROMPT}];

toggle.onclick = () => { win.classList.toggle('open'); if(win.classList.contains('open')) input.focus(); };
closeBtn.onclick = () => win.classList.remove('open');

function addMsg(text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  messagesEl.appendChild(d);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return d;
}

async function send(){
  const text = input.value.trim();
  if(!text) return;
  if(API_KEY.includes("PASTE_YOUR")){
    addMsg("⚠️ اول باید یک کلید API رایگان از console.groq.com بگیری و در کد جایگذاری کنی.", "bot");
    return;
  }
  addMsg(text, 'user');
  history.push({role:"user", content:text});
  input.value = '';
  sendBtn.disabled = true;
  const typing = addMsg('در حال تایپ...', 'bot typing');

  try{
    const res = await fetch(API_URL, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + API_KEY
      },
      body: JSON.stringify({
        model: MODEL,
        messages: history,
        max_tokens: 600
      })
    });
    const data = await res.json();
    typing.remove();
    if(data.error){
      addMsg("خطا: " + data.error.message, 'bot');
      return;
    }
    const reply = data.choices[0].message.content;
    addMsg(reply, 'bot');
    history.push({role:"assistant", content:reply});
  }catch(err){
    typing.remove();
    addMsg("خطا در اتصال. اتصال اینترنت یا کلید API را بررسی کن.", 'bot');
  }finally{
    sendBtn.disabled = false;
  }
}

sendBtn.onclick = send;
input.addEventListener('keydown', e=>{
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});

addMsg("سلام! من دستیار هوش مصنوعی تو هستم. چطور می‌تونم کمکت کنم؟", 'bot');
</script>
</body>
</html>
